kind = "mobile"
previewPath = "/"
title = "Resident Portal"
version = "1.0.0"
id = "artifacts/resident-portal"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20267

[services.development]
run = "pnpm --filter @workspace/resident-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/resident-portal", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/resident-portal", "run", "serve" ]

[services.env]
PORT = "20267"
BASE_PATH = "/"
